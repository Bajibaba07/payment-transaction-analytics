name: Validate payment analytics project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dashboard.txt -r requirements-api.txt
      - name: Rebuild synthetic datasets and reports
        run: |
          python src/generate_customers.py
          python src/generate_cards.py
          python src/generate_merchants.py
          python src/generate_transactions.py
          python src/validate_data.py
          python src/clean_data.py
          python src/eda.py
          python src/anomaly_detection.py
      - name: Run unit, API, and dashboard smoke tests
        run: python -m unittest discover -s tests -v
