services:
  - type: web
    name: payment-analytics-api
    runtime: python
    buildCommand: >-
      mkdir -p data/raw data/processed &&
      pip install -r requirements-api.txt &&
      python src/generate_customers.py &&
      python src/generate_cards.py &&
      python src/generate_merchants.py &&
      python src/generate_transactions.py &&
      python src/validate_data.py &&
      python src/clean_data.py
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
